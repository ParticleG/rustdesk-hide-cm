name: Build and publish to AUR

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aur-publish.yml
      - .gitignore
      - .SRCINFO
      - PKGBUILD
      - README.md
      - '*.patch'
      - '*.install'
  pull_request:
    paths:
      - .github/workflows/aur-publish.yml
      - .gitignore
      - .SRCINFO
      - PKGBUILD
      - README.md
      - '*.patch'
      - '*.install'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: aur-publish-rustdesk-hide-cm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build package
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:base-devel
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git namcap sudo

      - name: Create unprivileged package builder
        run: |
          useradd --create-home builder
          printf 'builder ALL=(root) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Validate package metadata
        run: |
          bash -n PKGBUILD rustdesk.install
          diff -u .SRCINFO <(runuser -u builder -- makepkg --printsrcinfo)

      - name: Build package as an unprivileged user
        run: runuser -u builder -- makepkg --cleanbuild --force --syncdeps --noconfirm

      - name: Inspect package and run CLI smoke check
        run: |
          namcap PKGBUILD ./*.pkg.tar.zst | tee "$RUNNER_TEMP/namcap.log"
          if grep -q ' E: ' "$RUNNER_TEMP/namcap.log"; then
            echo 'namcap reported package errors.' >&2
            exit 1
          fi
          package_version=$(sed -n 's/^[[:space:]]*pkgver = //p' .SRCINFO)
          actual_version=$(runuser -u builder -- env LD_BIND_NOW=1 pkg/rustdesk-hide-cm/usr/lib/rustdesk/rustdesk --version)
          test "$actual_version" = "$package_version"

      - name: Upload built packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustdesk-hide-cm-${{ github.sha }}
          path: '*.pkg.tar.zst'
          if-no-files-found: error

  publish:
    name: Publish verified package recipe
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Publish to AUR
        env:
          AUR_REPOSITORY_URL: ssh://aur@aur.archlinux.org/rustdesk-hide-cm.git
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo 'AUR_SSH_PRIVATE_KEY is required.' >&2
            exit 1
          fi

          ssh_dir=$(mktemp -d "$RUNNER_TEMP/aur-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          key_file="$ssh_dir/id_ed25519"
          known_hosts="$ssh_dir/known_hosts"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key_file"
          # AUR Ed25519 host key, also used by the ompweb publication workflow.
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$known_hosts"
          export GIT_SSH_COMMAND="ssh -i '$key_file' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$known_hosts'"

          aur_dir="$RUNNER_TEMP/aur-repository"
          git clone "$AUR_REPOSITORY_URL" "$aur_dir"
          git -C "$aur_dir" rm -r --ignore-unmatch -- .
          cp PKGBUILD .SRCINFO .gitignore README.md ./*.patch rustdesk.install "$aur_dir/"
          git -C "$aur_dir" add --all

          if git -C "$aur_dir" diff --cached --quiet; then
            echo 'AUR package repository is already up to date.'
            exit 0
          fi

          git -C "$aur_dir" config user.name 'ParticleG'
          git -C "$aur_dir" config user.email 'particle_g@outlook.com'
          git -C "$aur_dir" commit -m "Sync from GitHub: $GITHUB_SHA"
          git -C "$aur_dir" push origin HEAD:master
